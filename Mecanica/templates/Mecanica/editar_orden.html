{% extends "Mecanica/base.html" %}
{% block contenido %}
    <h1>Editar orden de trabajo</h1>
    <form method="POST">
        {% csrf_token %}
        <label for="vehiculo">Vehículo</label>
        <select id="vehiculo" name="vehiculo" required>
            <option value="">Selecciona un vehículo</option>
            {% for v in vehiculos %}
                <option value="{{ v.patente }}" {% if orden.vehiculo.patente == v.patente %}selected{% endif %}>
                    {{ v.patente }} - {{ v.modelo }}
                </option>
            {% endfor %}
        </select>
        <label for="fecha_entrega_estimada">Fecha de entrega estimada</label>
        <input type="date" id="fecha_entrega_estimada" name="fecha_entrega_estimada" value="{{ orden.fecha_entrega_estimada|date:'Y-m-d' }}">
        <label for="kilometraje">Kilometraje</label>
        <input type="number" id="kilometraje" name="kilometraje" value="{{ orden.kilometraje_ingreso }}" required>
        <label for="observaciones">Observaciones</label>
        <textarea name="observaciones" id="observaciones">{{ orden.observaciones }}</textarea>
        <label for="servicios">Servicios</label>
        <select multiple id="servicios" name="servicios">
            {% for s in servicios %}
                <option value="{{ s.id }}" {% if s in orden.servicios.all %}selected{% endif %}>
                    {{ s.nombre }}
                </option>
            {% endfor %}
        </select>

        <button type="submit">Guardar cambios</button>
    </form>
{% endblock %}
