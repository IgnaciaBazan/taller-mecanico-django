

{% extends "Mecanica/base.html" %}
{% block contenido %}
    <h1>Editar vehículo</h1>
    <form method="POST" id="form-vehiculo" novalidate>
        {% csrf_token %}
        <label for="patente">Patente</label>
        <input type="text" id="patente" name="patente" value="{{ vehiculo.patente }}" readonly>
        <span class="error-campo" id="error-patente"></span>

        <label for="modelo">Modelo</label>
        <input type="text" id="modelo" name="modelo" value="{{ vehiculo.modelo }}" required>

        <label for="anio">Año</label>
        <input type="number" id="anio" name="anio" value="{{ vehiculo.anio }}" required>
        <span class="error-campo" id="error-anio"></span>


        <label for="kilometraje">Kilometraje</label>
        <input type="number" id="kilometraje" name="kilometraje" value="{{ vehiculo.kilometraje }}" required>

        <label for="marca">Marca</label>
        <select id="marca" name="marca" required>
            <option value="">Selecciona una marca</option>
            {% for m in marcas %}
                <option value="{{ m.id }}" {% if m.id == vehiculo.marca.id %}selected{% endif %}>
                    {{ m.nombre }}
                </option>
            {% endfor %}
        </select>
        <span class="error-campo" id="error-marca"></span>

        <label for="cliente">Cliente</label>
        <select id="cliente" name="cliente" required>
            <option value="">Selecciona un cliente</option>
            {% for c in clientes %}
                <option value="{{ c.id }}" {% if c.id == vehiculo.cliente.id %}selected{% endif %}>
                    {{ c.nombres }} {{ c.apellidos }}
                </option>
            {% endfor %}
        </select>

        <button type="submit">Guardar</button>
    </form>
{% endblock %}
