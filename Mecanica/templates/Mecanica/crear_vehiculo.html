{% extends "Mecanica/base.html" %}
{% block contenido %}
    <h1>Registrar vehículo</h1>
    {% if error %}
        <p class="error-campo">{{ error }}</p>
    {% endif %}
    <form method="POST" id="form-vehiculo" novalidate>
        {% csrf_token %}
        <label for="patente">Patente</label>
        <input type="text" id="patente" name="patente" required>
        <span class="error-campo" id="error-patente"></span>

        <label for="modelo">Modelo</label>
        <input type="text" id="modelo" name="modelo" required>
        <span class="error-campo" id="error-modelo"></span>

        <label for="anio">Año</label>
        <input type="number" id="anio" name="anio" required>
        <span class="error-campo" id="error-anio"></span>

        <label for="kilometraje">Kilometraje</label>
        <input type="number" id="kilometraje" name="kilometraje" required>

        <label for="marca">Marca</label>
        <select id="marca" name="marca" required>
            <option value="">Selecciona una marca</option>
            {% for m in marcas %}
                <option value="{{ m.id }}">{{ m.nombre }}</option>
            {% endfor %}
        </select>
        <span class="error-campo" id="error-marca"></span>

        <label for="cliente">Cliente</label>
        <select id="cliente" name="cliente" required>
            <a href="{% url 'crear_cliente' %}">+ Nuevo cliente</a>
            <option value="">Selecciona un cliente</option>
            {% for c in clientes %}
                <option value="{{ c.id }}">{{ c.nombres }} {{ c.apellidos }}</option>
            {% endfor %}
        </select>
        <span class="error-campo" id="error-cliente"></span>
        <button type="submit">Guardar</button>
    </form>
{% endblock %}
