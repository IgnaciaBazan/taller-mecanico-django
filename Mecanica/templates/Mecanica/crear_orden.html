{% extends "Mecanica/base.html" %}

{% block contenido %}
    <h1>Crear orden de trabajo</h1>
    <form method="POST">
        {% csrf_token %}
        <label for="vehiculo">Vehículo</label>
        <select id="vehiculo" name="vehiculo" required>
            <option value="">Selecciona un vehículo</option>
            {% for v in vehiculos %}
                <option value="{{ v.patente }}">{{ v.patente }} - {{ v.modelo }}</option>
            {% endfor %}
        </select>
        <label for="fecha_entrega_estimada">Fecha de entrega estimada</label>
        <input type="date" id="fecha_entrega_estimada" name="fecha_entrega_estimada">
        <label for="kilometraje">Kilometraje</label>
        <input type="number" id="kilometraje" name="kilometraje" required>
        <label for="observaciones">Observaciones</label>
        <textarea name="observaciones" id="observaciones"   placeholder="Observaciones"></textarea>
        <label for="servicios">Servicios</label>
        <select multiple id="servicios" name="servicios">
            <option value="">Selecciona servicios</option>
            {% for s in servicios %}
                <option value="{{ s.id }}">{{ s.nombre }}</option>
            {% endfor %}
        </select>

        <button type="submit">Guardar</button>
    </form>
{% endblock %}
