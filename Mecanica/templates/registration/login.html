
<!DOCTYPE html>
<html lang="es">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — Taller Mecánico</title>
    <link rel="stylesheet" href="{% static 'Mecanica/css/estilos.css' %}">
</head>
<body>
    <nav>
        <a href="{% url 'inicio' %}">Taller Mecánico</a>
    </nav>

    <main>
        <h1>Iniciar sesión</h1>
        {% if form.errors %}
            <p class="error-campo">Usuario o contraseña incorrectos.</p>
        {% endif %}
        <form method="post" id="form-login" novalidate>
            {% csrf_token %}
            <label for="id_username">Usuario</label>
            <input type="text" name="username" id="id_username" required>
            <span class="error-campo" id="error-username"></span>

            <label for="id_password">Contraseña</label>
            <input type="password" name="password" id="id_password" required>
            <span class="error-campo" id="error-password"></span>

            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit">Iniciar sesión</button>
        </form>
    </main>
</body>
</html>
